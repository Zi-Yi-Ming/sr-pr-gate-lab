merge_queue:
  max_parallel_checks: 1
  status_comments: none
  queue_controls_comment: false
  queued_label: null
  checking_label: null
  dequeued_label: null

queue_rules:
  - name: native-gate-lab
    queue_conditions:
      - base = lab-target/mergify-native-gate
      - check-success = PR Gate
    merge_conditions:
      - base = lab-target/mergify-native-gate
      - check-success = PR Gate
      - check-success = Queue Draft Verified
    merge_method: squash
    update_method: merge
    batch_size: 1
    max_checks_retries: 1

  - name: pre-handoff-5661
    queue_conditions:
      - base = lab-target/5661-prehandoff
      - check-success = PR Gate
    merge_conditions:
      - base = lab-target/5661-prehandoff
      - check-success = PR Gate
      - check-success = Queue Draft Verified
    merge_method: squash
    update_method: merge
    batch_size: 1
    max_checks_retries: 1

  - name: gate-5661-legacy
    queue_conditions:
      - base = lab-target/5661-v2
      - label = lab-5661-queue-legacy
      - 'check-success = PR Gate'
    merge_conditions:
      - base = lab-target/5661-v2
      - 'check-success = PR Gate'
    merge_method: squash
    update_method: merge
    batch_size: 1
    max_checks_retries: 1

  - name: gate-5661-v2
    queue_conditions:
      - base = lab-target/5661-v2
      - 'check-success = @github-actions/PR Gate v2'
    merge_conditions:
      - base = lab-target/5661-v2
      - 'check-success = @github-actions/PR Gate v2'
    merge_method: squash
    update_method: merge
    batch_size: 1
    max_checks_retries: 1

  - name: lab-pr-qualification-dual
    queue_conditions:
      - base ~= ^lab-target/(a-success|b-success|native-success)$
      - 'check-success = @github-actions/PR Qualification'
    merge_conditions:
      - base ~= ^lab-target/(a-success|b-success|native-success)$
      - 'check-success = @github-actions/PR Qualification'
    merge_method: squash
    update_method: merge
    batch_size: 1
    max_checks_retries: 0

  - name: lab-pr-qualification-draft
    queue_conditions:
      - base ~= ^lab-target/pr-qualification-draft-(failure|success)$
      - label = lab-pr-qualification-draft
      - 'check-success = @github-actions/PR Qualification'
    merge_conditions:
      - base ~= ^lab-target/pr-qualification-draft-(failure|success)$
      - 'check-success = @github-actions/PR Qualification'
    merge_method: squash
    update_method: merge
    batch_size: 1
    max_checks_retries: 1
    batch_max_failure_resolution_attempts: 0
    checks_timeout: 15 minutes

  - name: lab-5661-dual-queue-n24
    queue_conditions:
      - base ~= ^lab-target/5661-dual-queue-n24-(success|failure)$
      - label = lab-5661-dual-queue-n24
      - 'check-success = @github-actions/PR Qualification'
      - 'check-success = @github-actions/CI Execution'
    merge_conditions:
      - base ~= ^lab-target/5661-dual-queue-n24-(success|failure)$
      - 'check-success = @github-actions/PR Qualification'
      - 'check-success = @github-actions/CI Execution'
    merge_method: squash
    update_method: merge
    batch_size: 1
    max_checks_retries: 0
    batch_max_failure_resolution_attempts: 0
    checks_timeout: 15 minutes


pull_request_rules:
  - name: Queue only the native Gate lab fixture
    conditions:
      - base = lab-target/mergify-native-gate
      - head ~= ^lab/mergify-(native|old-api|old-api-sibling|old-api-sibling-clean|old-api-sibling-first|old-api-review|production-api)-gate$
      - author = Zi-Yi-Ming
      - label = lab-mergify-native-gate
      - -draft
    actions:
      queue:
        name: native-gate-lab

  - name: Submit the review event for the isolated Community control
    conditions:
      - base = lab-target/mergify-native-gate
      - head ~= ^lab/mergify-(old-api-review|production-api)-gate$
      - author = Zi-Yi-Ming
      - assignee = Zi-Yi-Ming
      - -closed
      - -draft
    actions:
      review:
        type: APPROVE

  - name: Queue only the pre-handoff controls
    conditions:
      - base = lab-target/5661-prehandoff
      - head ~= ^lab/5661-prehandoff-(positive|queue)$
      - author = Zi-Yi-Ming
      - label = lab-mergify-native-gate
      - -draft
    actions:
      queue:
        name: pre-handoff-5661

  - name: Queue only the 5661 legacy fixture
    conditions:
      - base = lab-target/5661-v2
      - head = lab/5661-v2-success
      - author = Zi-Yi-Ming
      - label = lab-5661-queue-legacy
      - -draft
    actions:
      queue:
        name: gate-5661-legacy

  - name: Queue only the 5661 v2 fixture
    conditions:
      - base = lab-target/5661-v2
      - head = lab/5661-v2-success
      - author = Zi-Yi-Ming
      - label = lab-5661-queue-v2
      - -draft
    actions:
      queue:
        name: gate-5661-v2

  - name: Verify only the three PR Qualification fixtures
    conditions:
      - base ~= ^lab-target/(a-success|b-success|native-success)$
      - head ~= ^lab/(ab-a-success|ab-b-success|native-success)$
      - author = Zi-Yi-Ming
      - label = lab-pr-qualification-dual
      - -draft
      - -closed
    actions:
      queue:
        name: lab-pr-qualification-dual

  - name: Queue only the dedicated PR Qualification draft controls
    conditions:
      - base ~= ^lab-target/pr-qualification-draft-(failure|success)$
      - head ~= ^lab/ab-(a|b)-success$
      - author = Zi-Yi-Ming
      - label = lab-pr-qualification-draft
      - -draft
      - -closed
    actions:
      queue:
        name: lab-pr-qualification-draft

  - name: Queue only the dual native qualification controls
    conditions:
      - base ~= ^lab-target/5661-dual-queue-n24-(success|failure)$
      - head ~= ^lab/5661-dual-queue-n24-(success|failure)$
      - author = Zi-Yi-Ming
      - label = lab-5661-dual-queue-n24
      - -draft
      - -closed
    actions:
      queue:
        name: lab-5661-dual-queue-n24
