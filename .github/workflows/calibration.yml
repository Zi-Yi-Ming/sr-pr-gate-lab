name: A/B Gate experiment
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Preserved default-branch dispatch schema.
        required: true
        type: choice
        options:
        - publish-and-probe
        - probe-only
        default: publish-and-probe
      manifest:
        description: Frozen bounded A/B envelope.
        required: false
        type: string
        default: ''
      source_run_id:
        description: Preserved input; A/B uses its verified envelope.
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: sr-pr-gate-lab-ab
  cancel-in-progress: false
env:
  LAB_AB_MANIFEST: ${{ inputs.manifest }}
jobs:
  seed:
    if: fromJSON(inputs.manifest).stage == 'seed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Run seed with exact lab identities
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ab_lab.py seed --output out/seed.json
  native_qualification:
    name: Native qualification
    if: fromJSON(inputs.manifest).stage == 'qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Run qualify with exact lab identities
      run: python3 ab_lab.py qualify --output out/qualification.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ab-qualification
        path: out/qualification.json
        retention-days: 14
        if-no-files-found: error
  execution:
    name: CI Execution
    needs: native_qualification
    if: always() && !cancelled() && fromJSON(inputs.manifest).stage == 'qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Preserve the actual native qualification result
      env:
        RESULT: ${{ needs.native_qualification.result }}
      run: test "$RESULT" = success
  relay:
    needs:
    - native_qualification
    - execution
    if: always() && !cancelled() && fromJSON(inputs.manifest).stage == 'qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Run relay with exact lab identities
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ab_lab.py relay --output out/relay.json
  publish:
    if: fromJSON(inputs.manifest).stage == 'driver'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ab-qualification
        path: out/input
        github-token: ${{ github.token }}
        run-id: ${{ fromJSON(inputs.manifest).qualification_run_id }}
    - name: Run publish with exact lab identities
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ab_lab.py publish --input out/input/qualification.json --output out/publication.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ab-publication
        path: out/publication.json
        retention-days: 14
        if-no-files-found: error
  baseline:
    needs: publish
    outputs:
      eligible: ${{ steps.proof.outputs.eligible }}
      advance: ${{ steps.proof.outputs.advance }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ab-publication
        path: out/input
    - name: Run baseline with exact lab identities
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ab_lab.py baseline --input out/input/publication.json --output out/baseline.json
      id: proof
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ab-baseline
        path: out/baseline.json
        retention-days: 14
        if-no-files-found: error
  recover:
    needs: baseline
    if: needs.baseline.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ab-baseline
        path: out/input
    - name: Run recover with exact lab identities
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ab_lab.py recover --input out/input/baseline.json --output out/recovery.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ab-recovery
        path: out/recovery.json
        retention-days: 14
        if-no-files-found: error
  probe:
    needs: recover
    outputs:
      advance: ${{ steps.proof.outputs.advance }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ab-recovery
        path: out/input
    - name: Run probe with exact lab identities
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ab_lab.py probe --input out/input/recovery.json --output out/probe.json
      id: proof
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ab-probe
        path: out/probe.json
        retention-days: 14
        if-no-files-found: error
  advance:
    needs:
    - baseline
    - probe
    if: always() && !cancelled() && fromJSON(inputs.manifest).stage == 'driver' && ((needs.baseline.result == 'success'
      && needs.baseline.outputs.advance == 'true') || (needs.probe.result == 'success' && needs.probe.outputs.advance
      == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ needs.probe.outputs.advance == 'true' && 'ab-probe' || 'ab-baseline' }}
        path: out/input
    - name: Run advance with exact lab identities
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_JSON: ${{ needs.probe.outputs.advance == 'true' && 'out/input/probe.json' || 'out/input/baseline.json'
          }}
      run: python3 ab_lab.py advance --input "$INPUT_JSON" --output out/advance.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ab-advance
        path: out/advance.json
        retention-days: 14
        if-no-files-found: error
  supplement_baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ab-publication
        path: out/source
        github-token: ${{ github.token }}
        run-id: '44048669391'
    - id: proof
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 supplement_a.py baseline --source out/source/publication.json --output out/supplement-baseline.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: supplement-baseline
        path: out/supplement-baseline.json
        retention-days: 14
        if-no-files-found: error
    if: fromJSON(inputs.manifest).stage == 'supplement' && inputs.phase == 'probe-only' && inputs.source_run_id
      == '44048669391'
    outputs:
      eligible: ${{ steps.proof.outputs.eligible }}
  supplement_recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ab-publication
        path: out/source
        github-token: ${{ github.token }}
        run-id: '44048669391'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: supplement-baseline
        path: out/input
    - id: proof
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 supplement_a.py recover --source out/source/publication.json --input out/input/supplement-baseline.json
        --output out/supplement-recover.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: supplement-recover
        path: out/supplement-recover.json
        retention-days: 14
        if-no-files-found: error
    needs: supplement_baseline
    if: needs.supplement_baseline.outputs.eligible == 'true'
  supplement_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ab-publication
        path: out/source
        github-token: ${{ github.token }}
        run-id: '44048669391'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: supplement-recover
        path: out/input
    - id: proof
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 supplement_a.py probe --source out/source/publication.json --input out/input/supplement-recover.json
        --output out/supplement-probe.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: supplement-probe
        path: out/supplement-probe.json
        retention-days: 14
        if-no-files-found: error
    needs: supplement_recover

  ng_seed:
    if: fromJSON(inputs.manifest).stage == 'native-seed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: write
      pull-requests: read
    env:
      NATIVE_MANIFEST: ${{ inputs.manifest }}
    outputs:
      protocol_valid: ${{ steps.proof.outputs.protocol_valid || steps.fallback.outputs.protocol_valid }}
      gate_success: ${{ steps.proof.outputs.gate_success || steps.fallback.outputs.gate_success }}
      eligible: ${{ steps.proof.outputs.eligible || steps.fallback.outputs.eligible }}
      advance: ${{ steps.proof.outputs.advance || steps.fallback.outputs.advance }}
      batch_complete: ${{ steps.proof.outputs.batch_complete || steps.fallback.outputs.batch_complete }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: proof
      if: always() && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 native_lab.py seed --output out/seed.json
    - name: Retain fail-closed evidence if checkout or command failed
      if: always()
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        import json
        import os
        p=Path('out/seed.json')
        if not p.exists():
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_text(json.dumps(dict(schema_version=1,kind='seed',repository='Zi-Yi-Ming/sr-pr-gate-lab',protocol_valid=False,gate_success=False,eligible=False,advance=False,batch_complete=False,strict_recovery_verified=False,outcome='INCONCLUSIVE',error='Checkout, download, or command failed before report creation'))+'\n')
            with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as stream:
                for key in ('protocol_valid','gate_success','eligible','advance','batch_complete'):
                    stream.write(key+'=false\n')
        PY
      id: fallback
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-seed
        path: out/seed.json
        retention-days: 14
        if-no-files-found: error
  ng_qualification:
    if: fromJSON(inputs.manifest).stage == 'native-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NATIVE_MANIFEST: ${{ inputs.manifest }}
    name: Native experiment qualification
    outputs:
      protocol_valid: ${{ steps.proof.outputs.protocol_valid || steps.fallback.outputs.protocol_valid }}
      gate_success: ${{ steps.proof.outputs.gate_success || steps.fallback.outputs.gate_success }}
      eligible: ${{ steps.proof.outputs.eligible || steps.fallback.outputs.eligible }}
      advance: ${{ steps.proof.outputs.advance || steps.fallback.outputs.advance }}
      batch_complete: ${{ steps.proof.outputs.batch_complete || steps.fallback.outputs.batch_complete }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: proof
      if: always() && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 native_lab.py qualify --output out/qualification.json
    - name: Retain fail-closed evidence if checkout or command failed
      if: always()
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        import json
        import os
        p=Path('out/qualification.json')
        if not p.exists():
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_text(json.dumps(dict(schema_version=1,kind='qualify',repository='Zi-Yi-Ming/sr-pr-gate-lab',protocol_valid=False,gate_success=False,eligible=False,advance=False,batch_complete=False,strict_recovery_verified=False,outcome='INCONCLUSIVE',error='Checkout, download, or command failed before report creation'))+'\n')
            with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as stream:
                for key in ('protocol_valid','gate_success','eligible','advance','batch_complete'):
                    stream.write(key+'=false\n')
        PY
      id: fallback
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-qualification
        path: out/qualification.json
        retention-days: 14
        if-no-files-found: error
  ng_execution:
    name: Native experiment CI Execution
    needs: ng_qualification
    if: always() && !cancelled() && fromJSON(inputs.manifest).stage == 'native-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NATIVE_MANIFEST: ${{ inputs.manifest }}
    steps:
    - name: Retain actual qualification job conclusion
      env:
        RESULT: ${{ needs.ng_qualification.result }}
      run: test "$RESULT" = success
  ng_qual_relay:
    if: always() && !cancelled() && fromJSON(inputs.manifest).stage == 'native-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: write
      pull-requests: read
    env:
      NATIVE_MANIFEST: ${{ inputs.manifest }}
    needs:
    - ng_qualification
    - ng_execution
    outputs:
      protocol_valid: ${{ steps.proof.outputs.protocol_valid || steps.fallback.outputs.protocol_valid }}
      gate_success: ${{ steps.proof.outputs.gate_success || steps.fallback.outputs.gate_success }}
      eligible: ${{ steps.proof.outputs.eligible || steps.fallback.outputs.eligible }}
      advance: ${{ steps.proof.outputs.advance || steps.fallback.outputs.advance }}
      batch_complete: ${{ steps.proof.outputs.batch_complete || steps.fallback.outputs.batch_complete }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-qualification
        path: out/qualification
    - id: proof
      if: always() && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 native_lab.py qual-relay --input out/qualification/qualification.json --output out/qual-relay.json
    - name: Retain fail-closed evidence if checkout or command failed
      if: always()
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        import json
        import os
        p=Path('out/qual-relay.json')
        if not p.exists():
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_text(json.dumps(dict(schema_version=1,kind='qual-relay',repository='Zi-Yi-Ming/sr-pr-gate-lab',protocol_valid=False,gate_success=False,eligible=False,advance=False,batch_complete=False,strict_recovery_verified=False,outcome='INCONCLUSIVE',error='Checkout, download, or command failed before report creation'))+'\n')
            with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as stream:
                for key in ('protocol_valid','gate_success','eligible','advance','batch_complete'):
                    stream.write(key+'=false\n')
        PY
      id: fallback
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-qual-relay
        path: out/qual-relay.json
        retention-days: 14
        if-no-files-found: error
  ng_publish:
    if: fromJSON(inputs.manifest).stage == 'native-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      actions: read
      pull-requests: read
    env:
      NATIVE_MANIFEST: ${{ inputs.manifest }}
    outputs:
      protocol_valid: ${{ steps.proof.outputs.protocol_valid || steps.fallback.outputs.protocol_valid }}
      gate_success: ${{ steps.proof.outputs.gate_success || steps.fallback.outputs.gate_success }}
      eligible: ${{ steps.proof.outputs.eligible || steps.fallback.outputs.eligible }}
      advance: ${{ steps.proof.outputs.advance || steps.fallback.outputs.advance }}
      batch_complete: ${{ steps.proof.outputs.batch_complete || steps.fallback.outputs.batch_complete }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-qualification
        path: out/qualification
        github-token: ${{ github.token }}
        run-id: ${{ fromJSON(inputs.manifest).qualification_run_id }}
    - id: proof
      if: always() && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 native_lab.py publish --input out/qualification/qualification.json --output out/publication.json
    - name: Retain fail-closed evidence if checkout or command failed
      if: always()
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        import json
        import os
        p=Path('out/publication.json')
        if not p.exists():
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_text(json.dumps(dict(schema_version=1,kind='publish',repository='Zi-Yi-Ming/sr-pr-gate-lab',protocol_valid=False,gate_success=False,eligible=False,advance=False,batch_complete=False,strict_recovery_verified=False,outcome='INCONCLUSIVE',error='Checkout, download, or command failed before report creation'))+'\n')
            with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as stream:
                for key in ('protocol_valid','gate_success','eligible','advance','batch_complete'):
                    stream.write(key+'=false\n')
        PY
      id: fallback
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-publication
        path: out/publication.json
        retention-days: 14
        if-no-files-found: error
  ng_baseline:
    if: fromJSON(inputs.manifest).stage == 'native-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      checks: read
      actions: read
      pull-requests: read
    env:
      NATIVE_MANIFEST: ${{ inputs.manifest }}
    needs: ng_publish
    outputs:
      protocol_valid: ${{ steps.proof.outputs.protocol_valid || steps.fallback.outputs.protocol_valid }}
      gate_success: ${{ steps.proof.outputs.gate_success || steps.fallback.outputs.gate_success }}
      eligible: ${{ steps.proof.outputs.eligible || steps.fallback.outputs.eligible }}
      advance: ${{ steps.proof.outputs.advance || steps.fallback.outputs.advance }}
      batch_complete: ${{ steps.proof.outputs.batch_complete || steps.fallback.outputs.batch_complete }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-publication
        path: out/publication
    - id: proof
      if: always() && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 native_lab.py baseline --input out/publication/publication.json --output out/baseline.json
    - name: Retain fail-closed evidence if checkout or command failed
      if: always()
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        import json
        import os
        p=Path('out/baseline.json')
