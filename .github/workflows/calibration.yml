name: Guard benchmark baseline diagnostics
run-name: Guard benchmark baseline diagnostics (2e4171d4 vs 157431c86)
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Select probe-only for the one diagnostic.
        type: choice
        required: true
        options:
          - publish-and-probe
          - probe-only
        default: probe-only

permissions:
  contents: read

jobs:
  baseline:
    if: ${{ github.ref_name == 'lab/7093-base-perf-diagnostic-20261121' && inputs.phase == 'probe-only' }}
    name: ${{ matrix.base.label }} / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        base:
          - label: 2e4171d4
            sha: 2e4171d4dd3d72d61188bb7ec529211fbc3263ad
          - label: 157431c86
            sha: 157431c868d81ba56f736809390e2743f0c54f5e
        suite: [Cache, Classify]
    env:
      HF_HUB_DISABLE_XET: "1"
      EXPERIMENT: ${{ matrix.base.label }}-${{ matrix.suite }}
    steps:
      - name: Set diagnostic paths
        run: |
          echo "VLLM_SRUN_CACHE_DIR=$RUNNER_TEMP/diagnostic-model-cache" >> "$GITHUB_ENV"
          echo "REPORTS=$RUNNER_TEMP/guard-bench" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/semantic-router
          ref: ${{ matrix.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/semantic-router
          ref: 14e67c09898f91a4997d600c4bb2bd3d8f2185a3
          path: harness
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify revisions and use the original benchmark harness
        env:
          BASE_SHA: ${{ matrix.base.sha }}
        run: |
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C harness rev-parse HEAD)" = 14e67c09898f91a4997d600c4bb2bd3d8f2185a3
          mv base/perf base/original-perf
          cp -a harness/perf base/perf
          mkdir -p "$REPORTS"
          {
            git -C base rev-parse HEAD
            git -C harness rev-parse HEAD
            sha256sum base/perf/benchmarks/model_runtime_test.go
            go version
            python3 --version
            lscpu
            df -h .
          } > "$REPORTS/runner.log"
      - name: Install the model runtime as in the original workflow
        working-directory: harness
        run: make harness-venv-install model-runtime-install
      - name: Start the instrumented base benchmark
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          base="$GITHUB_WORKSPACE/base"
          export PYTHONPATH="$base/src/model-runtime"
          export GIT_WORK_TREE="$base"
          nohup "$GITHUB_WORKSPACE/harness/.venv-agent/bin/python" -u "$GITHUB_WORKSPACE/diagnostics.py" \
            run "$base" "$SUITE" "$REPORTS" > "$REPORTS/supervisor.log" 2>&1 < /dev/null &
          echo "$!" > "$REPORTS/supervisor.pid"
      - uses: ./.github/actions/checkpoint
        with:
          seconds: "20"
      - uses: ./.github/actions/checkpoint
        with:
          seconds: "75"
      - uses: ./.github/actions/checkpoint
        with:
          seconds: "130"
      - uses: ./.github/actions/checkpoint
        with:
          seconds: "165"
      - uses: ./.github/actions/checkpoint
        with:
          seconds: "210"
      - uses: ./.github/actions/checkpoint
        with:
          seconds: "360"
      - name: Collect the benchmark result
        run: python3 -u diagnostics.py wait "$REPORTS"
      - name: Upload final diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPERIMENT }}-final
          path: ${{ env.REPORTS }}
          if-no-files-found: warn
          retention-days: 14
