name: Lab 5661 qualification
on:
  pull_request:
    types: [labeled]
    branches: [lab-target/5661-v2]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event.label.name == 'lab-5661-qualify' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 lab-5661-v2/qualify.py
      - uses: actions/upload-artifact@v4
        with:
          name: lab-5661-receipt-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-5661-receipt.json
      - name: Report any fixture failure
        run: test "$(jq -r .verdict "$RUNNER_TEMP/lab-5661-receipt.json")" != failure
