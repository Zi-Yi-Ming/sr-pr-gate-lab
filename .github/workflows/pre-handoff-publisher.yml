name: Pre-handoff previous Gate publisher

'on':
  workflow_dispatch:
    inputs:
      pr:
        description: Isolated original or Mergify draft number
        required: true
        type: string
      seed:
        description: Skipped Community workflow run
        required: true
        type: string
      qualification:
        description: Successful Pull Request workflow run
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish the attested lab API Gate
    if: >-
      github.repository == 'Zi-Yi-Ming/sr-pr-gate-lab'
      && github.ref == 'refs/heads/lab/mergify-native-config'
      && github.actor == 'Zi-Yi-Ming'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the tested revision and publish one check
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_PR: ${{ inputs.pr }}
          LAB_SEED: ${{ inputs.seed }}
          LAB_RUN: ${{ inputs.qualification }}
        run: python3 -B controls/pre_handoff_publisher.py "$LAB_PR" "$LAB_SEED" "$LAB_RUN"
