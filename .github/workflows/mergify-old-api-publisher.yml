name: Publish old API Gate for the Mergify control

'on':
  workflow_dispatch:
    inputs:
      pr:
        description: Original lab pull request number
        required: true
        type: string
      head:
        description: Frozen original PR head
        required: true
        type: string
      base:
        description: Frozen protected target tip
        required: true
        type: string
      seed:
        description: Completed skipped Community run
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish the verified API PR Gate
    if: >-
      github.repository == 'Zi-Yi-Ming/sr-pr-gate-lab'
      && github.ref == 'refs/heads/lab/mergify-native-config'
      && github.actor == 'Zi-Yi-Ming'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the fixture and publish one check through the Checks API
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_PR: ${{ inputs.pr }}
          LAB_HEAD: ${{ inputs.head }}
          LAB_BASE: ${{ inputs.base }}
          LAB_SEED: ${{ inputs.seed }}
        run: python3 -B controls/mergify_api_gate.py --pr "$LAB_PR" --head "$LAB_HEAD" --base "$LAB_BASE" --seed "$LAB_SEED"
