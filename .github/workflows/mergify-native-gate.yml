name: Native Gate merge queue control

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [lab-target/mergify-native-gate]

permissions:
  contents: read

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the fixture on the exact tested tree
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = "Zi-Yi-Ming/sr-pr-gate-lab"
          target = "lab-target/mergify-native-gate"
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event["pull_request"]
          head, base, actor = pr["head"], pr["base"], pr["user"]
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_EVENT_NAME"] == "pull_request"
          assert head["repo"]["full_name"] == base["repo"]["full_name"] == repo
          assert base["ref"] == target

          if pr["draft"]:
              assert (actor["id"], actor["login"], actor["type"]) == (
                  37929162, "mergify[bot]", "Bot"
              )
              assert head["ref"].startswith("mergify/merge-queue/")
          else:
              assert actor["login"] == "Zi-Yi-Ming"
              assert head["ref"] in ("lab/mergify-native-gate", "lab/mergify-production-base-advance")

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          source = git("rev-parse", "HEAD")
          assert source == os.environ["GITHUB_SHA"]
          fixture = json.loads(Path("mergify-gate-fixture.json").read_text())
          assert fixture["contract"] == "native-gate-mergify"
          assert sum(fixture["components"]) == 42

          receipt = {
              "pr": pr["number"],
              "draft": pr["draft"],
              "author": actor["login"],
              "head": head["sha"],
              "base": base["sha"],
              "tested_revision": source,
              "tree": git("rev-parse", "HEAD^{tree}"),
              "run": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          output = Path("out/mergify-gate.json")
          output.parent.mkdir(exist_ok=True)
          output.write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-gate-evidence-${{ github.run_attempt }}
          path: out/mergify-gate.json
          if-no-files-found: error
          retention-days: 7

  draft-evidence:
    name: Queue Draft Verified
    needs: gate
    if: >-
      github.event.pull_request.draft
      && github.event.pull_request.user.id == 37929162
      && startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: echo 'Native Gate passed on the authenticated Mergify queue draft'
