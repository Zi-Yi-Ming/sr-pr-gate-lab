name: Pre-handoff positive queue draft
'on':
  pull_request:
    types: [unassigned]
    branches: [lab-target/5661-prehandoff]
permissions:
  contents: read
jobs:
  qualification:
    name: PR Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -B controls/pre_handoff_fixture.py
        env:
          LAB_KIND: queue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-receipt-${{ github.run_attempt }}
          path: pre-handoff.json
          if-no-files-found: error
          retention-days: 7
  draft-evidence:
    name: Queue Draft Verified
    needs: qualification
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Positive queue draft verified'
