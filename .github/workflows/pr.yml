name: Requested CI native Gate control
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [lab-target/ci-run-native]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  PYTHONPATH: tools/ci

concurrency:
  group: lab-ci-run-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Materialize the pinned Plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m controls.requested_ci plan --output out/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-plan
          path: out/plan.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  gate:
    name: PR Gate
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Require the Plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Recheck authorization and run the qualification fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m controls.requested_ci gate --output out/native-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-native-gate-attempt-${{ github.run_attempt }}
          path: out/native-gate.json
          if-no-files-found: error
          retention-days: 7
