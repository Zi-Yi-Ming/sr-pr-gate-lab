name: PR Gate API coexistence current qualification

'on':
  pull_request:
    types: [ready_for_review]
    branches:
      - lab-target/pr-event-api-waiting
      - lab-target/pr-event-api-partial
      - lab-target/pr-event-api-failure
      - lab-target/pr-event-api-success

permissions:
  contents: read

jobs:
  gate:
    name: PR Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - run: python3 -B -m controls.api_gate_coexistence current
