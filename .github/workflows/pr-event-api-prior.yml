name: PR Gate API coexistence prior qualification

'on':
  pull_request:
    types: [labeled]
    branches:
      - lab-target/pr-event-api-waiting
      - lab-target/pr-event-api-partial
      - lab-target/pr-event-api-failure
      - lab-target/pr-event-api-success

permissions:
  contents: read

jobs:
  qualify:
    name: CI Execution
    if: ${{ github.event.label.name == 'lab-api-prior-qualification' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - run: python3 -B -m controls.api_gate_coexistence prior --receipt out/prior.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-coexistence-prior
          path: out/prior.json
          if-no-files-found: error
          retention-days: 14
