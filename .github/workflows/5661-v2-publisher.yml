name: Lab native Gate initial receipt
on:
  workflow_dispatch:
    inputs:
      pr: {type: string, required: true}
      run: {type: string, required: true}
      attempt: {type: string, required: true}
      variant:
        type: choice
        required: true
        options: [legacy, v2]
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
jobs:
  receipt:
    if: github.repository == 'Zi-Yi-Ming/sr-pr-gate-lab' && github.ref == 'refs/heads/lab/5661-native-guard-writer-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      LAB_INPUT: ${{ format('{0}/{1}/{2}/{3}', inputs.pr, inputs.run, inputs.attempt, inputs.variant) }}
    steps:
      - name: Publish the verified initial fixture status
        shell: bash
        run: |
          set -eu
          repo='Zi-Yi-Ming/sr-pr-gate-lab'
          head='9418c2868ea2d91ed70ddc26e7814cccd61b70f2'
          run=44926706655
          test "$LAB_INPUT" = "21/$run/1/legacy"
          gh api "repos/$repo/pulls/21" |
            jq -e --arg h "$head" '.state == "open" and .head.sha == $h and .base.ref == "lab-target/control-clean"' >/dev/null
          gh api "repos/$repo/actions/runs/$run" |
            jq -e --arg h "$head" '
              .event=="pull_request" and .head_sha==$h and .run_attempt==1 and .conclusion=="success"
              and .path==".github/workflows/same-name-native-guard-test.yml"
            ' >/dev/null
          gh api "repos/$repo/actions/runs/$run/attempts/1/jobs" |
            jq -e 'any(.jobs[]; .name=="PR Gate" and .conclusion=="success")' >/dev/null
          gh api "repos/$repo/commits/$head/statuses" |
            jq -e 'all(.[]; .context!="PR Gate")' >/dev/null
          gh api "repos/$repo/statuses/$head" --method POST \
            -f context='PR Gate' -f state=success -f description='Verified native lab attempt 1' \
            -f target_url="https://github.com/$repo/actions/runs/$run/attempts/1" \
            --jq '{id,context,state,target_url,creator:.creator.id}'
